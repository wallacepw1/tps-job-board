services:
  - type: web
    name: tps-job-board
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: CALENDAR_ICS_URL
        sync: false
      - key: INCOMING_CHANNEL_ID
        value: C0C19TG3KJ6
      - key: TZ_NAME
        value: America/Los_Angeles

      - key: TPS_CALL_ACTIONS_URL
        sync: false
      - key: TPS_INTERNAL_KEY
        sync: false
      - key: TPS_CALL_ROUTE_SIGNING_SECRET
        sync: false
